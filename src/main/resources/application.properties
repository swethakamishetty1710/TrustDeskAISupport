# ==========================================
# TrustDesk Application
# ==========================================

spring.application.name=TrustDeskAISupport

# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/trustdesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=MySQL@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================

server.port=8080

# Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY}

X-TrustDesk-Token: demo-token

trustdesk.auth.token=demo-token
